<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>An Giang – Miền đất hồn quê</title>

<!-- Nhúng Google Fonts mới: Playfair Display cho tiêu đề & Montserrat cho nội dung -->
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">

<style>
:root {
    --pine:#123f32;
    --green:#24664c;
    --gold:#e9bd62;
    --cream:#f7f5ed;
    --ink:#20372e;
}

* {
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html {
    scroll-behavior:smooth;
}

body {
    font-family: 'Montserrat', Arial, sans-serif;
    color:var(--ink);
    background:white;
    line-height:1.7;
}

a {
    color:inherit;
    text-decoration:none;
}

.wrap {
    width:min(1160px,90%);
    margin:auto;
}

/* HEADER */
header {
    height:72px;
    position:sticky;
    top:0;
    background:#ffffffed;
    z-index:9;
    box-shadow:0 3px 18px #0000000d;
}

.nav {
    height:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand {
    font-family: 'Playfair Display', Georgia, serif;
    font-size:24px;
    font-weight:900;
    color:var(--pine);
}

.brand b {
    color:var(--gold);
}

nav {
    display:flex;
    gap:24px;
    font-size:13px;
    font-weight:bold;
    letter-spacing: 0.5px;
}

nav a {
    transition: color 0.2s ease;
}

nav a:hover {
    color:#b4842d;
}

/* BANNER */
.hero {
    min-height:610px;
    display:grid;
    place-items:center;
    text-align:center;
    color:white;
    background:
    linear-gradient(90deg,#08291dcc,#08291d66),
    url('https://angiang.gov.vn') center/cover;
}

.hero .wrap {
    padding:100px 0;
}

.eyebrow {
    letter-spacing:5px;
    color:#f3d58e;
    font-size:12px;
    font-weight:bold;
}

.hero h1 {
    font:bold clamp(48px,8vw,88px)/1.1 'Playfair Display', Georgia, serif;
    margin:20px 0;
}

.hero h1 span {
    color:#f3d58e;
}

.hero p {
    max-width:700px;
    margin:auto;
    font-size:17px;
    font-weight: 300;
}

.btn {
    display:inline-block;
    margin-top:28px;
    padding:13px 26px;
    border-radius:30px;
    background:var(--gold);
    color:#183b2d;
    font-weight:bold;
    transition: all 0.3s ease;
}

.btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(233, 189, 98, 0.4);
}

/* SECTION */
.section {
    padding:82px 0;
}

.soft {
    background:var(--cream);
}

.heading {
    text-align:center;
    margin:0 auto 42px;
    max-width:750px;
}

.heading small {
    color:#b18435;
    letter-spacing:3px;
    font-weight:bold;
}

.heading h2 {
    font:bold clamp(30px,4vw,44px) 'Playfair Display', Georgia, serif;
    color:var(--pine);
    margin:9px 0 12px;
}

.heading p {
    color:#69786f;
    font-size: 15px;
}

/* INTRODUCTION */
.intro {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:42px;
    align-items:center;
}

.photo {
    width:100%;
    height:390px;
    object-fit:cover;
    border-radius:18px;
    box-shadow:0 14px 35px #163d2b20;
}

.intro h2 {
    font:bold 38px 'Playfair Display', Georgia, serif;
    color:var(--pine);
    margin:8px 0 18px;
}

.intro p {
    margin-bottom:12px;
    color:#5e6f65;
    font-size: 15px;
}

/* HIGHLIGHTS */
.facts {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-top:32px;
}

.fact {
    background:white;
    border-radius:14px;
    overflow:hidden;
    text-align:center;
    box-shadow:0 5px 20px #183c2b0b;
}

.fact img {
    width:100%;
    height:140px;
    object-fit:cover;
}

.fact-text {
    padding:13px;
}

.fact strong {
    display:block;
    font-size:18px;
    color:var(--green);
    font-family: 'Playfair Display', Georgia, serif;
    margin-bottom:2px;
}

.fact span {
    font-size:12px;
    color:#68766d;
}

/* GENERAL CARD */
.grid {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.card {
    border-radius:16px;
    overflow:hidden;
    background:white;
    box-shadow:0 8px 25px #173e2b12;
    transition:.25s;
}

.card:hover {
    transform:translateY(-5px);
}

.card img {
    height:220px;
    width:100%;
    object-fit:cover;
    background:#dce8dd;
}

.card .body {
    padding:20px;
}

.tag {
    font-size:11px;
    color:#a4772e;
    font-weight:bold;
    letter-spacing:1px;
}

.card h3 {
    color:var(--pine);
    font:bold 22px 'Playfair Display', Georgia, serif;
    margin:7px 0;
}

.card p {
    font-size:14px;
    color:#64746a;
}

/* DESTINATIONS (Biến đổi grid hiển thị 2 cột) */
#diemden .grid {
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:24px;
}

#diemden .card {
    display:grid;
    grid-template-columns:42% 58%;
    min-height:235px;
    align-items:stretch;
}

#diemden .card img {
    height:100%;
    min-height:235px;
    object-fit:cover;
}

#diemden .card .body {
    padding:22px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

#diemden .card h3 {
    font-size:21px;
}

#diemden .card p {
    font-size:13.5px;
    line-height:1.75;
}

/* CULTURE */
.two {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:22px;
}

.culture {
    display:flex;
    align-items:stretch;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 6px 22px #183c2b0b;
    min-height:240px;
    transition:.3s;
}

.culture:hover {
    transform:translateY(-5px);
}

.culture img {
    width:42%;
    object-fit:cover;
    min-height:240px;
}

.culture div {
    padding:22px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    flex:1;
}

.culture h3 {
    color:var(--pine);
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 20px;
    margin:5px 0;
}

.culture p {
    font-size:14px;
    color:#64746a;
}

/* FOOD */
.food .card img {
    height:210px;
}

/* ITINERARY */
.plan {
    max-width:900px;
    margin:auto;
}

.day {
    display:flex;
    gap:22px;
    align-items:center;
    background:white;
    padding:22px;
    border-radius:14px;
    margin:18px 0;
    box-shadow:0 5px 18px #173e2b0b;
}

.day img {
    width:230px;
    height:155px;
    object-fit:cover;
    border-radius:10px;
    flex-shrink:0;
}

.day b {
    background:var(--pine);
    color:white;
    padding:12px;
    border-radius:10px;
    min-width:100px;
    text-align:center;
    font-family: 'Playfair Display', Georgia, serif;
}

.day-copy {
    flex:1;
}

.day h3 {
    color:var(--pine);
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 20px;
    margin-bottom:8px;
}

.day p {
    font-size:14px;
    color:#64746a;
}

/* GALLERY */
.gallery {
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.gallery img {
    height:190px;
    width:100%;
    object-fit:cover;
    border-radius:12px;
    transition:.3s;
}

.gallery img:hover {
    transform:scale(1.04);
}

/* EXPERIENCE */
.experience-grid {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.experience-card {
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 20px #173e2b12;
}

.experience-card img {
    width:100%;
    height:200px;
    object-fit:cover;
}

.experience-card div {
    padding:20px;
}

.experience-card h3 {
    color:var(--pine);
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 18px;
    margin-bottom:8px;
}

.experience-card p {
    color:#64746a;
    font-size:14px;
}

/* TIPS */
.tips-grid {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.tip {
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 20px #173e2b12;
}

.tip img {
    width:100%;
    height:190px;
    object-fit:cover;
}

.tip div {
    padding:20px;
}

.tip h3 {
    color:var(--pine);
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 18px;
    margin-bottom:8px;
}

.tip p {
    color:#64746a;
    font-size:14px;
}

/* CALLOUT */
.callout {
    background:
    linear-gradient(120deg,#103d30e8,#28664be0),
    url('https://angiang.gov.vn') center/cover;
    color:white;
    text-align:center;
    padding:85px 20px;
}

.callout h2 {
    font:bold 38px 'Playfair Display', Georgia, serif;
    margin-bottom:14px;
}

.callout p {
    max-width:760px;
    margin:auto;
    color:#e2eee5;
    font-weight: 300;
}

/* FOOTER */
footer {
    background:#0d2e24;
    color:#d6e2d9;
    padding:42px 0;
    text-align:center;
    font-size:13px;
}

footer strong {
    color:#f1ce7e;
}

.credit {
    margin-top:12px;
    color:#aebfb3;
    font-size:12px;
}

/* RESPONSIVE */
@media(max-width:800px) {
    nav {
        gap:12px;
        font-size:11px;
    }
    .intro {
        grid-template-columns:1fr;
    }
    .grid {
        grid-template-columns:repeat(2,1fr);
    }
    #diemden .grid {
        grid-template-columns:1fr;
    }
    .facts {
        grid-template-columns:repeat(2,1fr);
    }
    .two {
        grid-template-columns:1fr;
    }
    .gallery {
        grid-template-columns:repeat(2,1fr);
    }
    .experience-grid,
    .tips-grid {
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:540px) {
    .section {
        padding:60px 0;
    }
    .grid,
    .experience-grid,
    .tips-grid {
        grid-template-columns:1fr;
    }
}
</style>
</head>
<body>
